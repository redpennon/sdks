version: 2

# Audit finding #17. One entry per language in this multi-language repo.
updates:
  - package-ecosystem: npm
    directory: "/node"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
