name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write  # needed to push go/v* tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-node:
    name: Publish Node SDK to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - name: Publish to npm
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # Idempotent on re-runs of the same tag, and safe when CURRENT is lower
          # than the published "latest" (npm refuses an implicit latest tag then).
          ALREADY=$(npm view @redpennon/node-sdk@${CURRENT} version 2>/dev/null || echo "")
          if [ "$ALREADY" = "$CURRENT" ]; then
            echo "Version ${CURRENT} already published, skipping publish step."
          else
            LATEST=$(npm view @redpennon/node-sdk@latest version 2>/dev/null || echo "0.0.0")
            HIGHER=$(printf '%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)
            if [ "$HIGHER" = "$LATEST" ] && [ "$LATEST" != "$CURRENT" ]; then
              npm publish --access public --tag next
            else
              npm publish --access public
            fi
          fi
          npm dist-tag add @redpennon/node-sdk@${CURRENT} latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      # --skip-existing makes a re-run on the same tag a no-op instead of failing.
      - run: twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  release-go:
    name: Tag Go module (go/vX.Y.Z)
    runs-on: ubuntu-latest
    needs: [release-node, release-python]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version and push go/ tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          GO_TAG="go/${VERSION}"
          # Idempotent: skip if the go/ tag already exists (local or remote).
          if git rev-parse -q --verify "refs/tags/${GO_TAG}" >/dev/null \
            || git ls-remote --exit-code --tags origin "${GO_TAG}" >/dev/null 2>&1; then
            echo "Tag ${GO_TAG} already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${GO_TAG}"
          git push origin "${GO_TAG}"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-node, release-python, release-go]
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
