[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redpennon"
version = "1.0.0"
description = "RedPennon feature flag evaluation API client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["feature-flags", "feature-toggles", "redpennon"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://redpennon.dev"
Documentation = "https://docs.redpennon.dev"
Repository = "https://github.com/redpennon/sdks"
"Bug Tracker" = "https://github.com/redpennon/sdks/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redpennon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=redpennon --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["redpennon"]

[tool.coverage.report]
omit = ["*/tests/*"]
