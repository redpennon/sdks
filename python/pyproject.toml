[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redpennon"
version = "0.1.0"
description = "RedPennon evaluation API client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redpennon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=redpennon --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["redpennon"]

[tool.coverage.report]
omit = ["*/tests/*"]
